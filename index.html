<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="JEJAK JKN — Health Insurance Claims Reconciliation &amp; Verification Platform">
  <meta name="color-scheme" content="light">
  <title>JEJAK JKN — Claims Verification Platform</title>
  <link rel="icon" type="image/svg+xml" href="brand/jejak-jkn-favicon.svg">
</head>
<body>
  <div class="app-layout" id="app-layout">
    <!-- Left Navigation Sidebar -->
    <aside class="app-sidebar" id="app-sidebar">
      <div class="sidebar-brand">
        <a href="#" class="sidebar-brand-link" id="sidebar-brand-link" title="JEJAK JKN">
          <img src="brand/jejak-jkn-logo-horizontal-dark.svg" alt="JEJAK JKN" class="brand-logo-img">
        </a>
      </div>

      <nav class="sidebar-nav" aria-label="Main Navigation">
        <button type="button" class="nav-item active" data-view="workspace" id="nav-workspace">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 5H7a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="9" y="3" width="6" height="4" rx="2"/><path d="m9 14 2 2 4-4"/></svg>
          <span class="nav-label">Claims Queue</span>
          <span class="nav-badge" id="tab-queue-badge">40</span>
        </button>

        <button type="button" class="nav-item" data-view="analytics" id="nav-analytics">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
          <span class="nav-label">Analytics</span>
        </button>

        <div class="sidebar-divider"></div>
        <div class="sidebar-section-title">Quick Actions</div>

        <button type="button" class="nav-item nav-action" id="sidebar-sync-btn">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
          <span class="nav-label">Sync Records</span>
        </button>

        <button type="button" class="nav-item nav-action" id="sidebar-export-btn">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
          <span class="nav-label">Export CSV</span>
        </button>

        <button type="button" class="nav-item nav-action" id="sidebar-reset-btn">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          <span class="nav-label">Reset Demo</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <button type="button" class="conn-pill" id="btn-conn-settings" title="Real-time Connection Settings">
          <span class="conn-dot" aria-hidden="true">●</span>
          <span id="conn-status-text">HEALTHKATHON-2026</span>
        </button>

        <div class="user-auth-area" id="user-auth-area">
          <button type="button" class="user-chip-btn" id="btn-user-switch" title="User Details">
            <span class="avatar" id="user-avatar" aria-hidden="true">VB</span>
            <span class="role" id="user-name">BPJS Auditor</span>
          </button>
          <button type="button" class="btn-logout" id="btn-logout" title="Sign Out">
            Sign Out
          </button>
        </div>
      </div>
    </aside>

    <!-- Main View Content -->
    <main class="app-main" id="app-main">
      <header class="main-topbar" id="main-topbar">
        <div class="topbar-left">
          <span class="topbar-title" id="topbar-title">Claims Verification Workbench</span>
        </div>
        <div class="topbar-right">
          <button type="button" class="button secondary small" id="export-csv">Export CSV</button>
          <button type="button" class="button secondary small" id="reset">Reset Demo</button>
        </div>
      </header>

      <div class="audit-metric-strip stats" id="stats" aria-live="polite"></div>

      <div id="view-root"></div>

      <div id="pitch-root" hidden></div>
    </main>
  </div>

  <div id="ticket-modal-root" hidden></div>
  <div class="toast" role="status" id="toast" hidden></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
