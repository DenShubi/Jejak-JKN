<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Circular Path for Text -->
    <path id="circleTextPath" d="M 100 100 m -74, 0 a 74,74 0 1,1 148,0 a 74,74 0 1,1 -148,0" />
    <path id="circleSubPath" d="M 100 100 m -58, 0 a 58,58 0 1,0 116,0 a 58,58 0 1,0 -116,0" />

    <linearGradient id="stampBorderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0b2847" />
    </linearGradient>
  </defs>

  <!-- Outer Dotted Security Ring -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="4 4" opacity="0.6" />
  
  <!-- Outer Solid Ring -->
  <circle cx="100" cy="100" r="88" fill="none" stroke="#059669" stroke-width="3" />
  
  <!-- Inner Ring -->
  <circle cx="100" cy="100" r="64" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="6 3" />

  <!-- Circular Outer Text: JEJAK JKN - BUKTI LAYANAN TERVERIFIKASI -->
  <text font-family="'Plus Jakarta Sans', sans-serif" font-size="11" font-weight="800" fill="#065f46" letter-spacing="2.8">
    <textPath href="#circleTextPath" startOffset="50%" text-anchor="middle">
      * SISTEM AUDIT JEJAK JKN * HEALTHKATHON 2026
    </textPath>
  </text>

  <!-- Circular Inner Text -->
  <text font-family="'Plus Jakarta Sans', sans-serif" font-size="8.5" font-weight="700" fill="#0284c7" letter-spacing="2">
    <textPath href="#circleSubPath" startOffset="50%" text-anchor="middle">
      PENELUSURAN KLAIM &amp; RME
    </textPath>
  </text>

  <!-- Center Shield & J-Checkmark -->
  <g transform="translate(68, 68) scale(0.53)">
    <!-- Shield -->
    <path d="M 60 8 C 82 8, 102 16, 106 36 C 110 66, 88 97, 60 112 C 32 97, 10 66, 14 36 C 18 16, 38 8, 60 8 Z" 
          fill="#061d33" stroke="#10b981" stroke-width="3" />

    <!-- J-Check -->
    <path d="M 58 26 L 58 68 C 58 80, 48 90, 36 90 C 24 90, 19 80, 20 72 C 21 62, 30 56, 40 58 C 44 59, 47 62, 49 66 L 62 82 L 96 42" 
          fill="none" stroke="#10b981" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Nodes -->
    <circle cx="58" cy="26" r="5" fill="#38bdf8" />
    <circle cx="62" cy="82" r="5" fill="#10b981" />
    <circle cx="96" cy="42" r="6" fill="#34d399" />
  </g>

  <!-- Star Embellishments -->
  <polygon points="100,12 102,17 107,17 103,20 105,25 100,22 95,25 97,20 93,17 98,17" fill="#059669" />
  <polygon points="100,175 102,180 107,180 103,183 105,188 100,185 95,188 97,183 93,180 98,180" fill="#059669" />
</svg>
